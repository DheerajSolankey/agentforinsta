<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reel Workbench</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23111'/><rect x='30' y='18' width='40' height='64' rx='6' fill='none' stroke='%23e8b44a' stroke-width='6'/></svg>" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" data-nav="projects">
        <span class="brand-mark"></span>
        <span class="brand-name">REEL WORKBENCH</span>
      </div>
      <nav class="mainnav" id="mainnav">
        <a href="#/projects" data-view="projects">Projects</a>
        <a href="#/media" data-view="media">Media</a>
        <a href="#/references" data-view="references">References</a>
        <a href="#/styles" data-view="styles">Styles</a>
        <a href="#/editor" data-view="editor">Editor</a>
        <a href="#/exports" data-view="exports">Exports</a>
      </nav>
      <div class="topbar-right">
        <span class="env-pill" id="envPill" title="FFmpeg environment">…</span>
        <a href="#/settings" class="icon-btn" title="Settings" data-view="settings">⚙</a>
      </div>
    </header>

    <main id="view" class="view"></main>

    <div id="toast" class="toast hidden"></div>
    <div id="modalRoot" class="modal-root hidden"></div>
    <div id="paletteRoot" class="palette-root hidden"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
